name: Container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - 'deploy/docker*'
      - deploy/test-docker.sh
      - .github/workflows/container.yml
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - vite.config.ts
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - 'deploy/docker*'
      - deploy/test-docker.sh
      - .github/workflows/container.yml
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the upstream checks
        run: docker build --target test --tag agent-office:test .
      - name: Test the production image and persistent storage
        run: bash deploy/test-docker.sh
